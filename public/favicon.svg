<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="code-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  
  <!-- Stylized Developer Code Mark < / > -->
  <g fill="none" stroke="url(#code-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- < -->
    <path d="M 23 20 L 13 32 L 23 44" />
    <!-- / -->
    <path d="M 36 18 L 28 46" />
    <!-- > -->
    <path d="M 41 20 L 51 32 L 41 44" />
  </g>
</svg>