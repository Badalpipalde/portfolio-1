<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <div id="output">Testing...</div>
  <script>
    async function runTest() {
      try {
        const form = new FormData();
        form.append('access_key', 'f61b06bf-edbb-4e48-af12-786d13da6198');
        form.append('name', 'Badal Test');
        form.append('email', 'badalpipalde3@gmail.com');
        form.append('subject', 'Test from Portfolio');
        form.append('message', 'Testing Web3Forms integration.');

        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: form
        });
        const data = await res.json();
        document.getElementById('output').innerText = 'RESULT: ' + JSON.stringify(data);
      } catch (err) {
        document.getElementById('output').innerText = 'ERROR: ' + err.toString();
      }
    }
    runTest();
  </script>
</body>
</html>
